name: Verificación de portafolio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio_ci
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PORTFOLIO_TEST_DATABASE_URL: postgresql://portfolio:portfolio_ci_only@127.0.0.1:5432/portfolio_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
